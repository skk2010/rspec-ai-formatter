AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0
  SuggestExtensions: false
  Exclude:
    - 'demo/**/*'
    - 'spec/**/*'

plugins:
  - rubocop-rake
#  - rubocop-rspec
Metrics/MethodLength:
  Max: 100
Metrics/ClassLength:
  Max: 200
Metrics/BlockLength:
  Max: 50
#RSpec/ExampleLength:
#  Max: 50
#RSpec/MultipleExpectations:
#  Max: 10
#RSpec/MultipleMemoizedHelpers:
#  Max: 15
Metrics/PerceivedComplexity:
  Max: 15
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/AbcSize:
  Max: 50
